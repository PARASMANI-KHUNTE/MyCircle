# CodeRabbit Configuration for MyCircle
# Docs: https://docs.coderabbit.ai/guides/configure-coderabbit

language: "en-US"

# Review settings
reviews:
  # Automatically request reviews on every PR/MR
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Profile: focus on logic, security & performance over style
  profile: "chill"

  # Only auto-review PRs (not every incremental push)
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  # Paths to focus on (backend + both frontends)
  path_filters:
    - "MyCircleAppSuite/Server/src/**"
    - "MyCircleAppSuite/Web/src/**"
    - "MyCircleAppSuite/Mobile/src/**"
    - "!**/node_modules/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/dist/**"

# Chat settings
chat:
  auto_reply: true
