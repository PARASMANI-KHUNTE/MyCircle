name: Bug report
description: Report a reproducible problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Server
        - Web
        - Mobile (Android)
        - Mobile (iOS)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: commit SHA or release tag
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
