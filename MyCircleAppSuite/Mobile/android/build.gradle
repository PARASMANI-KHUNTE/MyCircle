buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.10"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Must match the AGP/Kotlin versions used by @react-native/gradle-plugin 0.88.1
        classpath("com.android.tools.build:gradle:9.2.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.3")
    }
}

plugins {
    id("com.facebook.react.rootproject")
}

// Native build workarounds for this repository's deeply nested Windows path:
// - react-native-worklets and react-native-reanimated are patched via
//   patch-package (see patches/) to stage CMake output outside the deep path
//   and disable redundant CMake self-regeneration.
// - android/app/build.gradle stages the app's autolinked CMake output in a
//   short temp directory as well.
