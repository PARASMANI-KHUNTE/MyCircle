<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>03 Local Map Discovery</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d7ff2",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>body {
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none
    }
.glass {
    background: rgba(16, 25, 34, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08)
    }
.glass-marker {
    background: rgba(13, 127, 242, 0.15);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(13, 127, 242, 0.3);
    box-shadow: 0 0 20px rgba(13, 127, 242, 0.2)
    }
.fuzz-halo {
    background: radial-gradient(circle, rgba(13, 127, 242, 0.15) 0%, rgba(13, 127, 242, 0) 70%)
    }
.map-bg {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuAfUx1LSxrGKsl2WC4J_cmEJRo6RcnfIm9h08UwsdWWX2XEM980nfghhL-HucpSfZfN62rEjyl7tW7Y33WKBmeseqcu_tOfOGLnQI6qwrPRKxodSioSsFN9IHMXBmPFrKG1rMnRpZxUkZ4GueeovTWewKJoW6721sIcXkyiRv_2-Flrng_L30wLyeEhq1kMa5uxMqH3WxGEZhg8wuQ7TPSBYhIIhYYew5vEe_LvWHcFLEROjhBURzR6Votj2TwghmvR3tvh1GaGFyGC);
    background-size: cover;
    background-position: center;
    filter: grayscale(1) brightness(0.3) contrast(1.2)
    }
.orbit-track {
    background: linear-gradient(90deg, #0d7ff2 0%, rgba(13, 127, 242, 0.1) 100%)
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden antialiased">
<!-- Main Map Container -->
<div class="relative h-screen w-full overflow-hidden bg-background-dark">
<!-- Base Map Layer -->
<div class="absolute inset-0 map-bg" data-alt="Dark monochrome city map aerial view"></div>
<div class="absolute inset-0 bg-gradient-to-t from-background-dark via-transparent to-background-dark/80"></div>
<!-- Privacy Fuzzed Markers -->
<!-- Marker 1 -->
<div class="absolute top-1/3 left-1/4 -translate-x-1/2 -translate-y-1/2 group">
<div class="fuzz-halo w-32 h-32 rounded-full absolute -top-12 -left-12 animate-pulse"></div>
<div class="glass-marker relative px-4 py-2 rounded-full flex items-center justify-center space-x-2">
<span class="text-primary text-xs font-bold">?24.50</span>
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-ping"></div>
</div>
</div>
<!-- Marker 2 -->
<div class="absolute top-1/2 right-1/4 -translate-x-1/2 -translate-y-1/2">
<div class="fuzz-halo w-40 h-40 rounded-full absolute -top-16 -left-16 opacity-60"></div>
<div class="glass-marker relative px-4 py-2 rounded-full flex items-center justify-center">
<span class="text-primary text-xs font-bold">FREE</span>
</div>
</div>
<!-- Marker 3 -->
<div class="absolute bottom-1/3 left-1/2 -translate-x-1/2">
<div class="fuzz-halo w-24 h-24 rounded-full absolute -top-8 -left-8"></div>
<div class="glass-marker relative px-4 py-2 rounded-full flex items-center justify-center">
<span class="text-primary text-xs font-bold">?12.00</span>
</div>
</div>
<!-- Marker 4 -->
<div class="absolute top-1/4 right-1/3">
<div class="fuzz-halo w-28 h-28 rounded-full absolute -top-10 -left-10 opacity-40"></div>
<div class="glass-marker relative px-4 py-2 rounded-full flex items-center justify-center">
<span class="text-primary text-xs font-bold">???</span>
</div>
</div>
<!-- Header Controls -->
<div class="absolute top-0 left-0 w-full p-6 space-y-4 pt-14">
<!-- Orbit Distance Slider Container -->
<div class="glass rounded-2xl p-4 w-full">
<div class="flex justify-between items-center mb-3">
<span class="text-xs font-medium text-white/60 tracking-wider uppercase">Discovery Orbit</span>
<span class="text-primary text-sm font-bold">2.5 km</span>
</div>
<div class="relative h-6 flex items-center">
<div class="absolute w-full h-1 bg-white/10 rounded-full"></div>
<div class="absolute w-1/2 h-1 orbit-track rounded-full"></div>
<div class="absolute left-1/2 -translate-x-1/2 w-5 h-5 bg-primary rounded-full shadow-[0_0_15px_rgba(13,127,242,0.8)] border-2 border-white/20"></div>
</div>
<div class="flex justify-between mt-2 px-1">
<span class="text-[10px] text-white/40">500m</span>
<span class="text-[10px] text-white/40">10km</span>
</div>
</div>
<!-- Search and Filter Bar -->
<div class="flex space-x-3">
<div class="glass flex-1 flex items-center px-4 py-3 rounded-full">
<span class="material-icons-round text-white/40 text-sm">search</span>
<input class="bg-transparent border-none text-sm focus:ring-0 placeholder-white/30 w-full ml-2" placeholder="Search community data..." type="text"/>
<div class="flex items-center space-x-1 bg-primary/20 px-2 py-1 rounded-full border border-primary/30">
<span class="material-icons-round text-[10px] text-primary">security</span>
<span class="text-[10px] text-primary font-bold uppercase tracking-tighter">Private</span>
</div>
</div>
<button class="glass w-12 h-12 flex items-center justify-center rounded-full text-white/60">
<span class="material-icons-round">tune</span>
</button>
</div>
</div>
<!-- Floating Action Buttons -->
<div class="absolute right-6 bottom-32 flex flex-col space-y-4">
<button class="glass w-14 h-14 flex items-center justify-center rounded-full shadow-lg">
<span class="material-icons-round text-white/80">layers</span>
</button>
<button class="bg-primary w-14 h-14 flex items-center justify-center rounded-full shadow-[0_0_20px_rgba(13,127,242,0.5)]">
<span class="material-icons-round text-white text-3xl">add</span>
</button>
<button class="glass w-14 h-14 flex items-center justify-center rounded-full shadow-lg">
<span class="material-icons-round text-white/80">my_location</span>
</button>
</div>
<!-- Glass Bottom Navigation -->
<div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md">
<div class="glass px-6 py-4 rounded-full flex justify-between items-center shadow-2xl">
<button class="flex flex-col items-center space-y-1 text-white/40 hover:text-white transition-colors">
<span class="material-icons-round">grid_view</span>
<span class="text-[10px] font-medium">Home</span>
</button>
<button class="flex flex-col items-center space-y-1 text-primary">
<span class="material-icons-round">map</span>
<span class="text-[10px] font-medium">Explore</span>
<div class="w-1 h-1 rounded-full bg-primary mt-0.5"></div>
</button>
<div class="w-px h-8 bg-white/10"></div>
<button class="flex flex-col items-center space-y-1 text-white/40 hover:text-white transition-colors">
<span class="material-icons-round">forum</span>
<span class="text-[10px] font-medium">Social</span>
</button>
<button class="flex flex-col items-center space-y-1 text-white/40 hover:text-white transition-colors">
<span class="material-icons-round">person_outline</span>
<span class="text-[10px] font-medium">Profile</span>
</button>
</div>
</div>
<!-- iOS Home Indicator Overlay (Simulated) -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/20 rounded-full"></div>
</div>
<!-- Status Bar (Simulated) -->
<div class="fixed top-0 left-0 w-full h-12 flex justify-between items-center px-8 z-50 pointer-events-none">
<span class="text-sm font-semibold">9:41</span>
<div class="flex items-center space-x-1.5">
<span class="material-icons-round text-sm">signal_cellular_alt</span>
<span class="material-icons-round text-sm">wifi</span>
<span class="material-icons-round text-sm">battery_full</span>
</div>
</div>
</body></html>
