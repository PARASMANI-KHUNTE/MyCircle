<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MyCircle Landing Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a855f7",
                        "secondary-accent": "#22d3ee",
                        "background-light": "#f7f5f8",
                        "background-dark": "#09090b",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            background-color: #09090b;
            overflow: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow-primary {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }
        .bg-gradient-mesh {
            background-image: 
                radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(34, 211, 238, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(34, 211, 238, 0.1) 0px, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display text-white bg-background-dark min-h-screen flex flex-col items-center justify-between p-8 overflow-hidden">
<!-- Background Animated Shapes Simulation -->
<div class="fixed inset-0 z-0 bg-gradient-mesh pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-primary/20 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-secondary-accent/10 rounded-full blur-[120px]"></div>
</div>
<!-- Top Spacer for iOS Status Bar Area -->
<div class="h-12 w-full z-10"></div>
<!-- Main Content Container -->
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-sm z-10 text-center">
<!-- Brand Logo Area -->
<div class="mb-12 relative">
<div class="w-24 h-24 bg-primary rounded-full flex items-center justify-center mb-6 neon-glow-primary relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-tr from-primary to-secondary-accent opacity-50"></div>
<span class="material-symbols-outlined text-white text-5xl relative z-10">adjust</span>
</div>
<h1 class="text-4xl font-extrabold tracking-tight mb-3">
                My<span class="text-primary">Circle</span>
</h1>
<p class="text-white/60 text-lg font-medium leading-relaxed max-w-[280px] mx-auto">
                The inner circle for creators and collectors.
            </p>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-4">
<!-- Glassmorphism Primary CTA -->
<button class="w-full flex items-center justify-center gap-3 py-4 glass-panel rounded-full border border-white/20 hover:bg-white/10 transition-all active:scale-95 group">
<div class="w-6 h-6 bg-white rounded-full flex items-center justify-center">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</div>
<span class="font-semibold text-white tracking-wide">Continue with Google</span>
</button>
<!-- Secondary Actions -->
<div class="pt-4 space-y-6">
<div class="flex flex-col gap-4">
<button class="text-white/80 hover:text-white transition-colors text-sm font-medium tracking-wide uppercase">
                        New here? <span class="text-primary font-bold">Create Account</span>
</button>
<button class="text-white/80 hover:text-white transition-colors text-sm font-medium tracking-wide uppercase">
                        Already have an account? <span class="text-primary font-bold">Log in</span>
</button>
</div>
</div>
</div>
</main>
<!-- Footer Area -->
<footer class="w-full z-10 pb-8 px-4">
<div class="flex flex-col items-center gap-4">
<div class="w-full h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
<div class="flex gap-6 text-[10px] text-white/40 uppercase tracking-[0.2em] font-bold">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</div>
</footer>
<!-- Decorative Bottom Element -->
<div class="fixed bottom-[-5%] left-1/2 -translate-x-1/2 w-[80%] h-32 bg-primary/20 blur-[100px] pointer-events-none rounded-full"></div>
</body></html>
