services:
  ai-server:
    build: .
    container_name: ai-server
    restart: unless-stopped
    environment:
      - API_SECRET_KEY=${API_SECRET_KEY}
      - DEVICE=${DEVICE:-auto}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/root/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    # Increase shared memory for PyTorch
    shm_size: '4gb'
    # Limit container RAM usage
    mem_limit: 4g
    networks:
      - ai-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ai-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - ai-server
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge

volumes:
  hf_cache:
